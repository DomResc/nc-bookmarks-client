name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes typecheck)
        run: npm run build

      # Every push/PR produces a build that can be downloaded and loaded into
      # Chrome with "Load unpacked", without compiling anything locally.
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: dist/
          retention-days: 7
